[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "Orchestrateur multi-agents local (Ollama + Mammouth)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "httpx>=0.27",
]

[project.scripts]
agents = "agents_cli.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents_cli*"]
